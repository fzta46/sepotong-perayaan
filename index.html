<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepotong Perayaan</title>
  <!-- Font Google Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #ffffff;
      font-weight: 600;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 25px;
    }
    audio {
      width: 100%;
      border-radius: 30px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🎵</div>
    <h1>Sepotong Perayaan</h1>
    <p>Lagu ini dinyanyikan oleh Kikik Ganteng.</p>
    <audio controls src="Sepotong Perayaan.mp3"></audio>
  </div>

</body>
</html>
