<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepotong Perayaan</title>
  <!-- Font Google Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.5rem;
      color: #ffffff;
      font-weight: 600;
    }
    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    audio {
      width: 100%;
      border-radius: 30px;
      margin-bottom: 20px;
      outline: none;
    }
    
    /* Area Lirik Berjalan */
    .lyrics-container {
      height: 160px;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 20px 0;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
    }
    .lyrics-container::-webkit-scrollbar {
      display: none;
    }
    .lyric-line {
      font-size: 0.95rem;
      color: #64748b;
      margin: 14px 0;
      transition: all 0.3s ease;
      opacity: 0.4;
    }
    .lyric-line.active {
      color: #38bdf8;
      font-weight: 600;
      font-size: 1.1rem;
      opacity: 1;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🎵</div>
    <h1>Sepotong Perayaan</h1>
    <p class="subtitle">Lagu ini dinyanyikan oleh Kikik Ganteng.</p>
    
    <audio id="audioPlayer" controls src="Sepotong Perayaan.mp3"></audio>

    <!-- Wadah Lirik -->
    <div class="lyrics-container" id="lyricsContainer"></div>
  </div>

  <script>
    // Sesuaikan angka detik (time) dan teks lirik lagu kamu di sini
    const lyricsData = [
      { time: 0, text: "Selamat Malam, yang Ter-Sayang" },
      { time: 8, text: "Kulihat Umurmu, yang bertambah Panjang" },
      { time: 16, text: "Dan Sekali lagi, Kau ku-Rayakan" },
      { time: 25, text: "Tak perlu menangis, Kau cukup mendengarkan" },
      { time: 34, text: "Ku berdoa, di setiap malam"},
      { time: 42, text: "Jika tak percaya, Tanyakan Rembulan"},
      { time: 50, text: "Cukup sekian, tak usah panjang-panjang"},
      { time: 58, text: "Karena Sang Rembulan, kan kembali Pulang"},
    ];

    const audio = document.getElementById('audioPlayer');
    const container = document.getElementById('lyricsContainer');

    // Menampilkan daftar lirik ke layar
    lyricsData.forEach((item, index) => {
      const p = document.createElement('p');
      p.classList.add('lyric-line');
      p.id = `line-${index}`;
      p.innerText = item.text;
      container.appendChild(p);
    });

    // Memantau detik pemutaran lagu
    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      let activeIndex = -1;

      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== -1) {
        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
          if (idx === activeIndex) {
            if (!el.classList.contains('active')) {
              el.classList.add('active');
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          } else {
            el.classList.remove('active');
          }
        });
      }
    });
  </script>
</body>
</html>
